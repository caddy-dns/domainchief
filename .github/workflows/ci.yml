name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  # Builds Caddy with this module and obtains real certificates from Let's Encrypt staging.
  # Needs the DOMAINCHIEF_TEST_ZONE repository variable and DOMAINCHIEF_API_TOKEN repository secret.
  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    concurrency:
      group: e2e
    env:
      DOMAINCHIEF_TEST_ZONE: ${{ vars.DOMAINCHIEF_TEST_ZONE }}
      DOMAINCHIEF_API_TOKEN: ${{ secrets.DOMAINCHIEF_API_TOKEN }}
    steps:
      - name: Check configuration
        id: configured
        run: |
          if [ -n "$DOMAINCHIEF_TEST_ZONE" ] && [ -n "$DOMAINCHIEF_API_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping the end-to-end test, DOMAINCHIEF_TEST_ZONE or DOMAINCHIEF_API_TOKEN is not configured."
          fi

      - uses: actions/checkout@v7
        if: steps.configured.outputs.ok == 'true'

      # The latest Caddy release can need a newer Go version than this module itself.
      - uses: actions/setup-go@v7
        if: steps.configured.outputs.ok == 'true'
        with:
          go-version: stable

      - name: Install xcaddy
        if: steps.configured.outputs.ok == 'true'
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: End-to-end test
        if: steps.configured.outputs.ok == 'true'
        run: ./e2e/run.sh
